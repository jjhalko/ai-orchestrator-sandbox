name: AI Pipeline

# Fires when someone adds a label to an issue
on:
  issues:
    types: [labeled]

permissions:
  contents: write        # push the ai/issue-N branch
  pull-requests: write   # open the PR
  issues: write          # post comments

# Only one run per issue at a time
concurrency:
  group: ai-pipeline-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pipeline:
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt

      - name: Plan stage
        id: plan
        run: python orchestrator/plan.py

      # The confidence gate: only code when the plan scored high enough
      - name: Code stage
        if: steps.plan.outputs.proceed == 'true'
        run: python orchestrator/code.py

      - name: Keep the raw stage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-issue-${{ github.event.issue.number }}
          path: orchestrator_runs/
