<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Daily Run</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background: linear-gradient(160deg, #f8fafc 0%, #e0e7ff 100%);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.25rem, 10vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .tagline {
      margin: 0 0 2rem;
      max-width: 32rem;
      font-size: clamp(1rem, 4vw, 1.25rem);
      color: #4b5563;
    }
    .soon {
      margin: 0;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      background: #4f46e5;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    footer {
      padding: 1.25rem;
      text-align: center;
      font-size: 0.8125rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main>
    <h1>The Daily Run</h1>
    <p class="tagline">Your daily digest of tech, games, and Lehigh Valley news</p>
    <p class="soon">Coming soon</p>
  </main>
  <footer>&copy; 2026 The Daily Run</footer>
</body>
</html>
